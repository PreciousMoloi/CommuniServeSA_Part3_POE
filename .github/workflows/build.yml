name: Android CI

# Runs on every push/PR to main, and can also be triggered manually from the
# Actions tab. This satisfies the PoE requirement to "make use of GitHub
# Actions to run tests and build your code to make sure it will work not
# just on your computer" - it proves the app builds and its tests pass on a
# clean machine, not only the developer's own PC.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # jvmTarget/sourceCompatibility in app/build.gradle.kts is set to 21,
      # so the CI JDK must match.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Installs the Android SDK command-line tools and accepts the SDK
      # licenses automatically, so the first Gradle build can download
      # whatever platform/build-tools version this project needs
      # (compileSdk 35) without failing on an unaccepted-license prompt.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Grant execute permission for gradlew
        working-directory: CommuniServe_SA_Part2_Updated
        run: chmod +x gradlew

      # Speeds up subsequent runs by reusing downloaded dependencies instead
      # of re-fetching the whole dependency graph every single push.
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        working-directory: CommuniServe_SA_Part2_Updated
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: CommuniServe_SA_Part2_Updated
        run: ./gradlew assembleDebug --stacktrace

      # Publishes the built APK as a downloadable build artifact on the
      # Actions run summary - visible, checkable evidence that the app
      # actually compiles and packages successfully in CI.
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: communiserve-sa-debug-apk
          path: CommuniServe_SA_Part2_Updated/app/build/outputs/apk/debug/app-debug.apk

      # Always publish test results, even if the test step above failed,
      # so a failing test is visible in the Actions run rather than just a
      # red X with no detail.
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: CommuniServe_SA_Part2_Updated/app/build/reports/tests/testDebugUnitTest/
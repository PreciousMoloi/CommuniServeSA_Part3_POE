# Render "Blueprint": one-click deploy of the CommuniServe SA REST API.
# Render dashboard -> New -> Blueprint -> pick this GitHub repo. See docs/DEPLOY_API_RENDER.md.
services:
  - type: web
    name: communiservesa-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET          # generated by Render (long random value, never committed)
        generateValue: true
      - key: FIREBASE_PROJECT_ID # enables server-side verification of Google SSO tokens
        value: communiserve-sa
